[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphrag-hackathon"
version = "0.1.0"
description = "Three-pipeline GraphRAG benchmark: LLM-Only, Basic RAG, GraphRAG with TigerGraph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # ── LLM providers (all three; only the one you use needs an API key) ──
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "groq>=0.9.0",
    "google-generativeai>=0.7.0",

    # ── TigerGraph GraphRAG client ─────────────────────────────────────────
    "pyTigerGraph>=1.0.0",
    "requests>=2.32.0",

    # ── Embeddings + NLP ───────────────────────────────────────────────────
    "sentence-transformers>=2.7.0",
    "chromadb>=0.5.0",

    # ── Accuracy evaluation ────────────────────────────────────────────────
    "bert-score>=0.3.13",
    "transformers>=4.40.0",
    "torch>=2.2.0",

    # ── Token counting ─────────────────────────────────────────────────────
    "tiktoken>=0.7.0",

    # ── Dashboard ─────────────────────────────────────────────────────────
    "gradio>=4.31.0",

    # ── Utilities ─────────────────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
]

[project.scripts]
graphrag-dashboard  = "dashboard.app:launch"
graphrag-evaluate   = "evaluation.accuracy:main"
graphrag-benchmark  = "evaluation.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["pipelines", "evaluation", "dashboard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]